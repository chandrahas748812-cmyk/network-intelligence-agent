# QLoRA config (4-bit base model, for a single-GPU run).
# GPU run only: python train_sft.py --config configs/qlora.yaml
base_model: meta-llama/Llama-3.1-8B-Instruct   # replace with your licensed base model
dataset: data/sft_train.jsonl

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  task_type: CAUSAL_LM

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  num_train_epochs: 3
  bf16: true
  logging_steps: 10
  save_steps: 100
  output_dir: checkpoints/qlora-v0.1.0

eval_gate_accuracy: 0.75
